  Urbint's only publicly distributed UI surface is @urbint/cl, an enterprise React
  Native design system built on Unistyles 3.0 covering iOS, Android and Web. It is a
  developer-facing component library, not an embeddable customer-facing widget or a
  hosted checkout-style element — Urbint publishes no embed script, no web component
  and no hosted iframe surface.
