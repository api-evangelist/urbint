aid: urbint
name: Urbint
description: 'Urbint builds AI-powered operational resilience software for gas, electric
  and telecom utilities, predicting and preventing incidents before they happen across
  three product lines: Worker Safety, Damage Prevention (including a modern 811 locate-ticket
  management system), and Emergency Preparedness & Response / storm response. Its
  "Model of the World" fuses weather, topography, environmental, community and infrastructure
  data with a customer''s own work, asset and outage data to score the risk on individual
  jobs and locate tickets. Urbint raised venture funding from Energy Impact Partners,
  Piva Capital, Energize Ventures, Blue Bear Capital, National Grid Partners, Fifth
  Wall, Salesforce Ventures and S2G, acquired Opvantek, WRM Software, Competers and
  iRestore, and was itself acquired by Itron for $325M in a deal announced 6 October
  2025. Urbint ships no public API program; its only public developer surface is a
  first-party npm design system, @urbint/cl, which bundles a local-stdio MCP server.'
